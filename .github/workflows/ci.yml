name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Testes e qualidade
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Obter o código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
          python -m pip install -e . --no-deps --no-build-isolation
      - name: Verificar estilo e erros estáticos
        run: python -m ruff check src tests scripts
      - name: Executar testes
        run: python -m pytest -q

  browser:
    name: Interface no navegador
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Obter o código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements-browser.txt
      - name: Preparar testes de interface
        run: |
          python -m pip install -r requirements.lock.txt -r requirements-browser.txt
          python -m pip install -e . --no-deps --no-build-isolation
          python -m playwright install chromium
      - name: Executar jornadas de interface
        run: python -m pytest tests/browser -q
